<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A special Valentine's Day message">
    <title>Be My Valentine? 💕</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <!-- Floating hearts background container -->
    <div id="hearts-container"></div>

    <!-- Confetti container -->
    <div id="confetti-container"></div>

    <!-- Main content -->
    <main class="container">
        <div class="content">
            <!-- Main heart decoration -->
            <div class="heart-decoration">❤️</div>

            <!-- Main question -->
            <h1 class="main-title">Will You Be My Valentine?</h1>

            <!-- Romantic subtitle -->
            <p class="subtitle">
                Every moment with you makes my heart skip a beat.<br>
                Let's make this Valentine's Day special together.
            </p>

            <!-- Buttons container -->
            <div class="buttons-container" id="buttonsContainer">
                <button class="btn btn-yes" id="yesBtn">Yes! 💕</button>
                <button class="btn btn-no" id="noBtn">No</button>
            </div>

            <!-- Hidden success message -->
            <div class="success-message hidden" id="successMessage">
                <div class="success-heart">💖</div>
                <h2 class="success-title">You made my day! 💕</h2>
                <p class="success-text">
                    I'm the luckiest person in the world!<br>
                    Can't wait to celebrate this special day with you.<br>
                    <strong>Happy Valentine's Day, my love!</strong>
                </p>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/hearts.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
